name: Build and validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror cpp/continuation.hpp cpp/bindings.cpp cpp/test_continuation.cpp
      - run: python -m pytest --cov=foldtrace --cov-report=term-missing
      - run: cmake -S . -B build/native -DFOLDTRACE_PYTHON=OFF
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: python -m build
      - name: Reinstall built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python examples/through_the_fold.py
      - run: foldtrace --output out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            out/
            dist/
